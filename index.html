<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>개인 기술 블로그</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #fff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; transition: 0.2s; cursor: pointer; }
        .card:hover { border-color: #58a6ff; background: #1f242c; }
        .card h3 { color: #58a6ff; margin-top: 0; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 개인 기술 블로그</h1>
        <p>학습 과정과 활동 기록을 정리하는 공간입니다.</p>
        
        <h2>📌 카테고리</h2>
        <div class="grid">
            <a href="#dev" onclick="alert('💻 개발 카테고리입니다. 추후 상세 글을 작성하세요!')">
                <div class="card"><h3>💻 개발</h3><p>프로그래밍 및 개발 기록</p></div>
            </a>
            <a href="#ctf" onclick="alert('🛡️ CTF / Wargame 카테고리입니다.')">
                <div class="card"><h3>🛡️ CTF / Wargame</h3><p>보안 문제 풀이 및 분석</p></div>
            </a>
            <a href="#bug" onclick="alert('🔍 Bug Bounty 카테고리입니다.')">
                <div class="card"><h3>🔍 Bug Bounty</h3><p>취약점 연구</p></div>
            </a>
            <a href="#doc" onclick="alert('📝 블로그 / 기술문서 카테고리입니다.')">
                <div class="card"><h3>📝 블로그 / 기술문서</h3><p>기술 정리 문서</p></div>
            </a>
            <a href="#conf" onclick="alert('🎓 논문 / 컨퍼런스 카테고리입니다.')">
                <div class="card"><h3>🎓 논문 / 컨퍼런스</h3><p>보안 자료 정리</p></div>
            </a>
            <a href="#cert" onclick="alert('🏆 공모전 / 자격증 카테고리입니다.')">
                <div class="card"><h3>🏆 공모전 / 자격증</h3><p>성과 및 자격증 기록</p></div>
            </a>
        </div>
    </div>
</body>
</html>
