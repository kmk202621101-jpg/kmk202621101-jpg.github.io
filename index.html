<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 기술 블로그</title>
    <!-- 트렌디한 개발자 폰트 (Inter & Fira Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: rgba(22, 27, 34, 0.75);
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-cyan: #39c5bb;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-primary); 
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
            color: var(--text-primary); 
            padding: 40px 20px; 
            margin: 0; 
            line-height: 1.6;
            min-height: 100vh;
        }

        .container { max-width: 860px; margin: 0 auto; position: relative; }

        /* 타이틀 디자인 */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 28px;
        }

        h1 { 
            color: var(--text-primary); 
            font-size: 26px; 
            font-weight: 700; 
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 프로필 카드 (글래스모피즘 적용) */
        .profile-card { 
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 28px; 
            margin-bottom: 36px; 
            display: flex; 
            align-items: center; 
            gap: 24px; 
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: border-color 0.3s;
        }

        .profile-card:hover {
            border-color: rgba(88, 166, 255, 0.4);
        }
        
        .profile-avatar { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            background: #1f242c; 
            border: 2px solid var(--accent-blue); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 38px;
            flex-shrink: 0; 
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.25);
        }

        .profile-info h2 { margin: 0 0 8px 0; color: #fff; font-size: 20px; font-weight: 700; }
        .profile-info p { margin: 6px 0; color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

        /* 태그 스펙 스타일 */
        .profile-tags { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { 
            background: rgba(33, 38, 45, 0.8); 
            border: 1px solid var(--border-color); 
            color: var(--accent-blue); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-family: 'Fira Code', monospace;
        }
        
        /* 메인 홈 카테고리 그리드 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 20px; }

        .card { 
            background: var(--bg-card); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 22px; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute;
